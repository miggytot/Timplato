<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timplato</title>
    <link rel="icon" type="image/x-icon" href="../timplatoLogo/Timplato-Blue-LOGO.png">
    <link rel="stylesheet" href="../CSS/navbar.css">
    <link rel="stylesheet" href="../CSS/reviewModal.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="nav">
        <img src="../timplatoLogo/Timplato-White2.png" alt="Timplato Logo" class="logo">
        <ul>
            <li class="search-nav-item" style="position:relative;">
                    <a href="#" id="searchToggle">
                        <div class="icon-container">
                            <span class="icon-search"></span>
                        </div>
                    </a>
                <input type="text" id="navbarSearchBar" class="navbar-search-bar" placeholder="Search..." />
            </li>
            <li>
                <a href="../HTML/landingPage.html">
                    <div class="icon-container">
                        <span class="icon-house"></span>
                    </div>
                </a>
            </li>
            <li><a href="../HTML/cart.html">
                <div class="icon-container">
                    <span class="icon-cart"></span>
                </div>
                </a>
            </li>
            <li class="dropdown-user" style="position:relative;">
                <a href="#" id="userDropdownToggle">
                    <div class="icon-container">
                        <span class="icon-user"></span>
                    </div>
                </a>
                <ul id="userDropdownMenu">
                    <li><a href="loginPage.html">Login</a></li>
                    <li><a href="signupPage.html">Sign Up</a></li>
                </ul>
            </li>
        </ul>
    </div>
    
    <!-- Review Modal -->
    <div class="button">
        <button class="add-review-btn" id="addReviewBtn" type="button">Add Review</button>
    </div>
    <!-- Modal overlay hidden by default -->
    <div class="modal-overlay" id="reviewModalOverlay" style="display:none;">
        <div class="modal-card">
            <div class="modal-header">
                <div class="modal-product">
                    <img id="modalProductImg" src="../img/product-placeholder.png" alt="Product" class="modal-product-img">
                    <div>
                        <div class="modal-product-title">Product Name</div>
                        <div class="modal-product-desc">Set of Product Name</div>
                        <div class="modal-product-price">₱950.00</div>
                    </div>
                </div>
            </div>
            <div class="modal-body">
                <div class="modal-rating-row">
                    <span class="modal-rating-label">Rating:</span>
                    <div class="modal-stars" id="modalStars"></div>
                </div>
                <div class="modal-review-row">
                    <textarea id="modalReviewText" class="modal-review-text" placeholder="Enter Review"></textarea>
                    <div class="modal-photo-row">
                        <label for="modalReviewPhoto" class="modal-photo-btn">
                            <span class="icon-camera modal-photo-icon"></span> Add Photo
                        </label>
                        <input type="file" id="modalReviewPhoto" accept="image/*" style="display:none;">
                        <div class="modal-photo-preview-wrapper" style="display:inline-block; position:relative;">
                            <img id="modalPhotoPreview" class="modal-photo-preview" style="display:none;" alt="Review Photo Preview">
                            <span class="icon-trash modal-photo-trash" style="display:none;"></span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="modal-btn modal-cancel" id="modalCancelBtn">Cancel</button>
                <button class="modal-btn modal-submit" id="modalSubmitBtn">Submit</button>
            </div>
        </div>
    </div>
    <script src="../JS/reviewModal.js"></script>

</body>
</html>
