<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/x-icon" href="../timplatoLogo/Timplato-Blue-LOGO.png">
    <link rel="stylesheet" href="../CSS/navbar.css">
    <link rel="stylesheet" href="../CSS/profile.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="nav">
        <img src="../timplatoLogo/Timplato-White2.png" alt="Timplato Logo" class="logo">
        <ul>
            <li class="search-nav-item" style="position:relative;">
                    <a href="#" id="searchToggle">
                        <div class="icon-container">
                            <span class="icon-search"></span>
                        </div>
                    </a>
                <input type="text" id="navbarSearchBar" class="navbar-search-bar" placeholder="Search..." />
            </li>
            <li>
                <a href="../HTML/landingPage.html">
                    <div class="icon-container">
                        <span class="icon-house"></span>
                    </div>
                </a>
            </li>
            <li><a href="../HTML/cart.html">
                <div class="icon-container">
                    <span class="icon-cart"></span>
                </div>
                </a>
            </li>
            <li class="dropdown-user" style="position:relative;">
                <a href="#" id="userDropdownToggle">
                    <div class="icon-container">
                        <span class="icon-user"></span>
                    </div>
                </a>
                <ul id="userDropdownMenu">
                    <li><a href="loginPage.html">Login</a></li>
                    <li><a href="signupPage.html">Sign Up</a></li>
                </ul>
            </li>
        </ul>
    </div>

        <div class="container py-5">
            <div class="row g-4">
                <!-- Profile Photo & Name -->
                <div class="col-lg-4">
                    <div class="card p-4 text-center shadow-sm">
                        <div class="mb-3 position-relative">
                            <img id="profilePhoto" src="../timplatoLogo/Timplato-Blue-LOGO.png" alt="Profile Photo" class="rounded-circle" style="width:140px;height:140px;object-fit:cover;">
                            <input type="file" id="profilePhotoInput" accept="image/*" style="display:none;">
                            <button class="btn btn-warning mt-3" id="editPhotoBtn" type="button">Edit Photo</button>
                        </div>
                        <div class="fw-semibold fs-4" id="profileName">Juan Dela Cruz</div>
                        <div class="text-primary fs-5" id="profilePhone">+63 9694206942 <span class="ms-1"><i class="bi bi-patch-check-fill"></i></span></div>
                    </div>
                </div>
                <!-- Address Edit -->
                <div class="col-lg-8">
                    <div class="card p-4 mb-4 shadow-sm">
                        <div class="fw-semibold mb-2">Address <span class="badge bg-secondary ms-2">Home</span> <span class="badge bg-secondary ms-1">Work</span></div>
                        <form id="addressForm">
                            <div class="row g-2 mb-2">
                                <div class="col-md-8">
                                    <label class="form-label">Street Address</label>
                                    <input type="text" class="form-control" id="addressStreet" required value="Blk 1 Lot 1 Santan St. Brgy. Kabaklaan">
                                </div>
                                <div class="col-md-4 d-flex align-items-end">
                                    <button class="btn btn-link ms-auto" type="button" id="editAddressBtn"><i class="bi bi-pencil"></i></button>
                                </div>
                            </div>
                            <div class="row g-2 mb-2">
                                <div class="col-md-4">
                                    <label class="form-label">Country</label>
                                    <select class="form-select" id="addressCountry">
                                        <option>Philippines</option>
                                        <option>USA</option>
                                        <option>Canada</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">City</label>
                                    <input type="text" class="form-control" id="addressCity" value="Antipolo City">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">State/Province</label>
                                    <input type="text" class="form-control" id="addressState" value="Rizal">
                                </div>
                            </div>
                            <div class="row g-2 mb-2">
                                <div class="col-md-4">
                                    <label class="form-label">ZIP Code</label>
                                    <input type="text" class="form-control" id="addressZip" value="1870">
                                </div>
                                <div class="col-md-8 d-flex align-items-center">
                                    <input class="form-check-input me-2" type="checkbox" id="addressDefault" checked>
                                    <label class="form-check-label" for="addressDefault">Set as your default shipping address</label>
                                </div>
                            </div>
                            <div class="text-end">
                                <button class="btn btn-warning" type="submit">SAVE</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
            <!-- General Information Edit -->
            <div class="card p-4 mt-4 shadow-sm">
                <div class="fw-semibold mb-3 fs-5">General Information</div>
                <form id="generalForm">
                    <div class="row g-3 mb-3">
                        <div class="col-md-3">
                            <label class="form-label">First Name</label>
                            <input type="text" class="form-control" id="generalFirstName" value="Juan">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Last Name</label>
                            <input type="text" class="form-control" id="generalLastName" value="Dela Cruz">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Gender</label>
                            <input type="text" class="form-control" id="generalGender" value="Bading">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Date of Birth</label>
                            <input type="date" class="form-control" id="generalDOB" value="">
                        </div>
                    </div>
                    <div class="row g-3 mb-3">
                        <div class="col-md-3">
                            <label class="form-label">Phone Number</label>
                            <input type="text" class="form-control" id="generalPhone" value="+63 9694206942">
                        </div>
                        <div class="col-md-5">
                            <label class="form-label">Email Address</label>
                            <input type="email" class="form-control" id="generalEmail" value="juandelacruz17@gmail.com">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" id="generalPassword" value="password123">
                        </div>
                    </div>
                    <div class="text-end">
                        <button class="btn btn-warning" type="submit">SAVE</button>
                    </div>
                </form>
            </div>
        </div>

        <script src="../JS/userProfile.js"></script>
        <script src="../JS/navbar.js"></script>
</body>
</html>
