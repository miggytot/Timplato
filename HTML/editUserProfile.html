<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="icon" type="image/x-icon" href="../timplatoLogo/Timplato-Blue-LOGO.png">
    <link rel="stylesheet" href="../CSS/navbar.css">
    <link rel="stylesheet" href="../CSS/editUserProfile.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="nav">
        <img src="../timplatoLogo/Timplato-White2.png" alt="Timplato Logo" class="logo">
        <ul>
            <li class="search-nav-item" style="position:relative;">
                    <a href="#" id="searchToggle">
                        <div class="icon-container">
                            <span class="icon-search"></span>
                        </div>
                    </a>
                <input type="text" id="navbarSearchBar" class="navbar-search-bar" placeholder="Search..." />
            </li>
            <li>
                <a href="../HTML/landingPage.html">
                    <div class="icon-container">
                        <span class="icon-house"></span>
                    </div>
                </a>
            </li>
            <li><a href="../HTML/cart.html">
                <div class="icon-container">
                    <span class="icon-cart"></span>
                </div>
                </a>
            </li>
            <li class="dropdown-user" style="position:relative;">
                <a href="#" id="userDropdownToggle">
                    <div class="icon-container">
                        <span class="icon-user"></span>
                    </div>
                </a>
                <ul id="userDropdownMenu">
                    <li><a href="loginPage.html">Login</a></li>
                    <li><a href="signupPage.html">Sign Up</a></li>
                </ul>
            </li>
        </ul>
    </div>

        <div class="container py-5">
            <div class="row g-4">
                <!-- Profile Photo & Name -->
                    <div class="col-lg-4">
                    <div class="card p-4 text-center shadow-sm h-100" style="max-width:400px;margin:auto;">
                        <div class="mb-3 position-relative">
                            <img id="profilePhoto" src="../timplatoLogo/Timplato-Blue-LOGO.png" alt="Profile Photo" class="rounded-circle" style="width:140px;height:140px;object-fit:cover;">
                            <input type="file" id="profilePhotoInput" accept="image/*" style="display:none;">
                            <div class="d-flex justify-content-center gap-2 mt-3">
                                <button class="btn btn-warning" id="editPhotoBtn" type="button">Edit Photo</button>
                                <button class="btn btn-danger" id="removePhotoBtn" type="button">Remove Photo</button>
                            </div>
                        </div>
                        <div class="fw-semibold fs-4" id="profileName">Juan Dela Cruz</div>
                        <div class="text-primary fs-5" id="profilePhone">+63 9694206942 <span class="ms-1"><i class="bi bi-patch-check-fill"></i></span></div>
                    </div>
                </div>
                <!-- General Information Edit -->
                    <div class="col-lg-8">
                    <div class="card p-4 shadow-sm h-100 w-300">
                        <div class="fw-semibold mb-3 fs-5">General Information</div>
                        <form id="generalForm">
                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label class="form-label">First Name</label>
                                    <input type="text" class="form-control" id="generalFirstName" value="">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Last Name</label>
                                    <input type="text" class="form-control" id="generalLastName" value="">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Gender</label>
                                    <select class="form-select" id="generalGender">
                                        <option value="">Select Gender</option>
                                        <option value="Male">Male</option>
                                        <option value="Female">Female</option>
                                        <option value="Other">Other</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Date of Birth</label>
                                    <input type="date" class="form-control" id="generalDOB" value="">
                                </div>
                            </div>
                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label class="form-label">Phone Number</label>
                                    <input type="text" class="form-control" id="generalPhone" value="">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Email Address</label>
                                    <input type="email" class="form-control" id="generalEmail" value="">
                                </div>
                            </div>
                            <div class="text-end">
                                <button class="btn btn-warning" type="submit">SAVE</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <script src="../JS/editUserProfile.js"></script>
        <script src="../JS/navbar.js"></script>
</body>
</html>
