<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - Timplato</title>
    <link rel="stylesheet" href="../CSS/navbar.css">
    <link rel="stylesheet" href="../CSS/specificProduct.css">
</head>
<body>
    <div class="nav">
    <li class="search-nav-item" style="position:relative;">
                    <a href="#" id="searchToggle">
                        <div class="icon-container">
                            <span class="icon-search"></span>
                        </div>
                    </a>
                <input type="text" id="navbarSearchBar" class="navbar-search-bar" placeholder="Search..." />
            </li>
            <li>
                <a href="../HTML/landingPage.html">
                    <div class="icon-container">
                        <span class="icon-house"></span>
                    </div>
                </a>
            </li>
            <li><a href="../HTML/cart.html">
                <div class="icon-container">
                    <span class="icon-cart"></span>
                </div>
                </a>
            </li>
            <li class="dropdown-user" style="position:relative;">
                <a href="#" id="userDropdownToggle">
                    <div class="icon-container">
                        <span class="icon-user"></span>
                    </div>
                </a>
                <ul id="userDropdownMenu">
                    <li><a href="loginPage.html">Login</a></li>
                    <li><a href="signupPage.html">Sign Up</a></li>
                </ul>
            </li>
        </ul>
    </div>
    <div class="product-page-container">
        <div class="product-image-section">
            <img id="mainProductImage" src="../pan1.jpg" alt="Product" class="main-product-image">
            <div class="product-image-slider" id="productImageSlider">
                <img src="../pan1.jpg" class="slider-thumb selected" onclick="selectImage(this)">
                <img src="../pan2.jpg" class="slider-thumb" onclick="selectImage(this)">
                <img src="../pan3.jpg" class="slider-thumb" onclick="selectImage(this)">
                <img src="../pan4.jpg" class="slider-thumb" onclick="selectImage(this)">
            </div>
        </div>
        <div class="product-details-section">
            <div class="product-title">10-Inch and 12-Inch Hybrid Nonstick Frying Pan Set</div>
            <div class="product-brand">Anolon X &nbsp;|&nbsp; SKU: 14338</div>
            <div class="product-rating">&#9733;&#9733;&#9733;&#9733;&#189; &nbsp; 4.5 | 2017 Reviews</div>
            <div class="product-price">₱11,000.00</div>
            <div class="quantity-section">
                <span>Quantity</span>
                <button class="quantity-btn" onclick="changeQuantity(-1)">-</button>
                <span class="quantity-value" id="quantityValue">1</span>
                <button class="quantity-btn" onclick="changeQuantity(1)">+</button>
            </div>
            <button class="add-to-cart-btn">Add to cart</button>
        </div>
    </div>
    <script>
        // Image slider logic
        function selectImage(img) {
            document.getElementById('mainProductImage').src = img.src;
            document.querySelectorAll('.slider-thumb').forEach(function(thumb) {
                thumb.classList.remove('selected');
            });
            img.classList.add('selected');
        }
        // Quantity counter logic
        let quantity = 1;
        function changeQuantity(val) {
            quantity += val;
            if (quantity < 1) quantity = 1;
            document.getElementById('quantityValue').textContent = quantity;
        }
    </script>
    <script src="../JS/navbar.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
        <script>
            lucide.createIcons();
        </script>
</body>
</html>
