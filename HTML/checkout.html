<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>
    <link rel="icon" type="image/x-icon" href="../timplatoLogo/Timplato-Blue-LOGO.png">
    <link rel="stylesheet" href="../CSS/checkout.css">
    <link rel="stylesheet" href="../CSS/navbar.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="nav">
        <img src="../timplatoLogo/Timplato-White2.png" alt="Timplato Logo" class="logo">
        <ul>
            <li class="search-nav-item" style="position:relative;">
                    <a href="#" id="searchToggle">
                        <div class="icon-container">
                            <span class="icon-search"></span>
                        </div>
                    </a>
                <input type="text" id="navbarSearchBar" class="navbar-search-bar" placeholder="Search..." />
            </li>
            <li>
                <a href="../HTML/landingPage.html">
                    <div class="icon-container">
                        <span class="icon-house"></span>
                    </div>
                </a>
            </li>
            <li><a href="../HTML/cart.html">
                <div class="icon-container">
                    <span class="icon-cart"></span>
                </div>
                </a>
            </li>
            <li class="dropdown-user" style="position:relative;">
                <a href="#" id="userDropdownToggle">
                    <div class="icon-container">
                        <span class="icon-user"></span>
                    </div>
                </a>
                <ul id="userDropdownMenu">
                    <li><a href="loginPage.html">Login</a></li>
                    <li><a href="signupPage.html">Sign Up</a></li>
                </ul>
            </li>
        </ul>
    </div>


        <div class="checkout-main-container container-fluid py-5">
            <div class="row g-4">
                <!-- Left: Delivery & Order -->
                <div class="col-lg-7">
                    <div class="checkout-section checkout-section-address mb-4 p-4 rounded shadow-sm">
                        <div class="mb-2 fw-semibold">Delivery Address</div>
                        <div id="deliveryAddress"></div>
                    </div>
                    <div class="checkout-section mb-4 p-4 rounded shadow-sm" style="background:#fff;">
                        <div class="fw-semibold mb-2 checkout-product-header">Product Ordered</div>
                        <div class="table-responsive">
                            <table class="table align-middle mb-0" id="checkoutProductsTable">
                                <thead>
                                    <tr style="background:#f7f7fa;">
                                        <th></th>
                                        <th>Product</th>
                                        <th>Unit Price</th>
                                        <th>Quantity</th>
                                        <th>Item Subtotal</th>
                                    </tr>
                                </thead>
                                <tbody id="checkoutProductsBody">
                                    <!-- Product rows will be inserted here -->
                                </tbody>
                            </table>
                        </div>
                        <div class="mt-3 text-end fw-semibold">Order Total: <span id="checkoutOrderTotal">₱0.00</span></div>
                    </div>
                    <div class="checkout-section mb-4 p-4 rounded shadow-sm" style="background:#fff;">
                        <div class="fw-semibold mb-2 checkout-payment-header">Payment Methods</div>
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="radio" name="paymentMethod" id="paymentCOD" value="COD" checked>
                            <label class="form-check-label" for="paymentCOD">Cash on Delivery</label>
                        </div>
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="radio" name="paymentMethod" id="paymentGCash" value="GCash">
                            <label class="form-check-label" for="paymentGCash">Payment Center / E-Wallet <span class="text-muted">GCash</span></label>
                        </div>
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="radio" name="paymentMethod" id="paymentCard" value="Card">
                            <label class="form-check-label" for="paymentCard">Credit / Debit Card <span class="text-muted">All banks accepted</span></label>
                        </div>
                    </div>
                </div>
                <!-- Right: Payment Details -->
                <div class="col-lg-5">
                    <div class="checkout-section checkout-section-details p-4 rounded shadow-sm">
                        <div class="fw-semibold mb-2">Payment Details:</div>
                        <div class="d-flex justify-content-between mb-2"><span>Subtotal:</span> <span id="checkoutSubtotal">₱0.00</span></div>
                        <div class="d-flex justify-content-between mb-2"><span>Delivery:</span> <span id="checkoutDeliveryFee">FREE</span></div>
                        <div class="mb-2">Choose a delivery method</div>
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="radio" name="deliveryMethod" id="deliveryPremium" value="Premium" data-fee="100">
                            <label class="form-check-label" for="deliveryPremium">Premium Delivery <span class="ms-2">₱100</span> <span class="text-muted ms-2">Your order will be delivered in 2 days</span></label>
                        </div>
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="radio" name="deliveryMethod" id="deliveryNamed" value="Named" data-fee="150">
                            <label class="form-check-label" for="deliveryNamed">Named Day Delivery <span class="ms-2">₱150</span> <span class="text-muted ms-2">Fit for your scheduled delivery</span></label>
                        </div>
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="radio" name="deliveryMethod" id="deliveryStandard" value="Standard" data-fee="0" checked>
                            <label class="form-check-label" for="deliveryStandard">Standard Delivery <span class="ms-2">FREE</span> <span class="text-muted ms-2">2-5 working days delivery</span></label>
                        </div>
                        <div class="input-group mb-2">
                            <input type="text" class="form-control" id="checkoutCouponInput" placeholder="Coupon/Voucher">
                            <button class="btn btn-primary" id="checkoutCouponBtn" type="button">Add</button>
                        </div>
                        <div class="d-flex justify-content-between mb-2"><span>Discount:</span> <span id="checkoutDiscount">-₱0.00</span></div>
                        <div class="d-flex justify-content-between mb-3 fw-semibold"><span>Total Payment:</span> <span id="checkoutTotalPayment">₱0.00</span></div>
                        <button class="btn btn-warning w-100 fw-semibold" id="checkoutBtn">CHECKOUT</button>
                    </div>
                </div>
            </div>
        </div>

        <script src="../JS/checkOut.js"></script>
        <script src="../JS/navbar.js"></script>
</body>
</html>
