<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="icon" type="image/x-icon" href="../timplatoLogo/Timplato-Blue-LOGO.png">
    <link rel="stylesheet" href="../CSS/loginPage.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="nav">
        <img src="../timplatoLogo/Timplato-White2.png" alt="Timplato Logo" class="logo">
        <ul>
            <li>
                <a href="../HTML/landingPage.html">
                    <div class="icon-container">
                        <span class="icon-house"></span>
                    </div>
                </a>
            </li>
            <li class="dropdown-user" style="position:relative;">
                <a href="#" id="userDropdownToggle">
                    <div class="icon-container">
                        <span class="icon-user"></span>
                    </div>
                </a>
                <ul id="userDropdownMenu">
                    <li><a href="loginPage.html">Login</a></li>
                    <li><a href="signupPage.html">Sign Up</a></li>
                </ul>
            </li>
        </ul>
    </div>

    <div class="hero-section">
        <header class="heroHeader">
            <div class="loginContainer">
            <form class="loginForm">
                <h2 class="formTitle">Login</h2>
                <div class="formGroup">
                    <label for="email" class="formLabel">Email</label>
                    <input type="email" id="email" class="formInput" placeholder="Enter your email" required>
                </div>
                <div class="formGroup">
                    <label for="password" class="formLabel">Password</label>
                    <input type="password" id="password" class="formInput" placeholder="Enter your password" required>
                </div>
                <a href="#forgot-password" class="forgotPasswordLink">Forgot Password?</a>
                <button type="submit" class="formButton">Login</button>
                <button type="button" class="formButton googleButton">
                            <img src="../Assets/google_logo.webp" alt="Google" class="googleIcon"> Log in with Google
                </button>
            </form>
            <p class="signupPrompt">Don't have an account? <a href="signupPage.html" class="signupLink">Sign up</a></p>
        </div>
        </header>
    </div>

    <div class="footer">
        <p>&copy; 2023 Timplato. All rights reserved.</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
