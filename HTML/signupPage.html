<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-up</title>
    <link rel="icon" type="image/x-icon" href="../timplatoLogo/Timplato-Blue-LOGO.png">
    <link rel="stylesheet" href="../CSS/signupPage.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="nav">
        <img src="../timplatoLogo/Timplato-White2.png" alt="Timplato Logo" class="logo">
        <ul>
            <li>
                <a href="../HTML/landingPage.html">
                    <div class="icon-container">
                        <span class="icon-house"></span>
                    </div>
                </a>
            </li>
            <li class="dropdown-user" style="position:relative;">
                <a href="#" id="userDropdownToggle">
                    <div class="icon-container">
                        <span class="icon-user"></span>
                    </div>
                </a>
                <ul id="userDropdownMenu">
                    <li><a href="loginPage.html">Login</a></li>
                    <li><a href="signupPage.html">Sign Up</a></li>
                </ul>
            </li>
        </ul>
    </div>

    <div class="hero-section">
        <header class="heroHeader">
            <div class="loginContainer">
                <form class="signupForm">
                    <h2 class="formTitle">Sign Up</h2>

                    <!-- First Name & Last Name -->
                    <div class="formRow">
                        <div class="formGroup">
                            <label for="firstName" class="formLabel">First Name</label>
                            <input type="text" id="firstName" class="formInput" placeholder="Enter your first name" required>
                        </div>
                        <div class="formGroup">
                            <label for="lastName" class="formLabel">Last Name</label>
                            <input type="text" id="lastName" class="formInput" placeholder="Enter your last name" required>
                        </div>
                    </div>

                    <!-- Email & Phone -->
                    <div class="formRow">
                        <div class="formGroup">
                            <label for="email" class="formLabel">Email</label>
                            <input type="email" id="email" class="formInput" placeholder="Enter your email" required>
                        </div>
                        <div class="formGroup">
                            <label for="phone" class="formLabel">Phone Number</label>
                            <input type="tel" id="phone" class="formInput" placeholder="Enter your phone number" required>
                        </div>
                    </div>

                        <!-- Passwords -->
                    <div class="formRow">
                        <div class="formGroup">
                            <label for="password" class="formLabel">Password</label>
                            <input type="password" id="password" class="formInput" placeholder="Enter your password" required>
                        </div>
                        <div class="formGroup">
                            <label for="repassword" class="formLabel">Re-enter Password</label>
                            <input type="password" id="repassword" class="formInput" placeholder="Re-enter your password" required>
                        </div>
                    </div>

                    <!-- Buttons -->
                    <div class="formRow buttonsRow">
                        <button type="submit" class="formButton">Sign Up</button>
                        <button type="button" class="formButton googleButton">
                            <img src="../Assets/google_logo.webp" alt="Google" class="googleIcon"> Sign Up with Google
                        </button>
                    </div>

                </form>
                <p class="signupPrompt">Already have an account? <a href="loginPage.html" class="signupLink">Login</a></p>
            </div>
        </header>
    </div>

    <div class="footer">
        <p>&copy; 2023 Timplato. All rights reserved.</p>
    </div>

    <script src="../JS/navbar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
