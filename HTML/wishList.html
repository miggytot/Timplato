<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishlist</title>
    <link rel="icon" type="image/x-icon" href="../timplatoLogo/Timplato-Blue-LOGO.png">
    <link rel="stylesheet" href="../CSS/navbar.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');

:root {
	--primary: #AFCBFF;
    --background: #9EB7E5;
	--secondary: #F4AE71;
	--accent: #F4AE71;
	--bg: #B6C6E7;
	--white: #fff;
	--text: #2C3E50;
	--border: #dbeafe;
    --danger: #c92828;
	--shadow: 0 2px 8px rgba(44,62,80,0.08);
}

body {
	background: var(--background) !important;
	font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
}

.wishlist-container {
	background: var(--white);
	border: 2px solid var(--border);
    margin-top: 170px !important;
	border-radius: 12px;
	box-shadow: var(--shadow);
	max-width: 1820px;
	margin: 32px auto;
	padding: 32px 32px 24px 32px;
}

.wishlist-search-row {
	display: flex;
	align-items: center;
	margin-bottom: 24px;
}
.wishlist-search {
	flex: 1;
	padding: 10px 18px;
	border-radius: 16px;
	border: 2px solid var(--border);
	font-size: 1.1rem;
	color: var(--text);
	background: var(--white);
	outline: none;
	box-shadow: none;
}
.wishlist-search:focus {
	border-color: var(--primary);
}
.wishlist-search-icon {
	width: 22px;
	height: 22px;
	margin-left: -36px;
	background: url('../SVG/search.svg') center/contain no-repeat;
	opacity: 0.7;
}

.wishlist-list {
	width: 100%;
}
.wishlist-item {
	display: flex;
	align-items: center;
	gap: 32px;
	padding: 24px 0 12px 0;
}
.wishlist-img {
	width: 110px;
	height: 110px;
	border-radius: 8px;
	background: #e5e7eb;
	object-fit: cover;
	border: 2px solid var(--border);
}
.wishlist-info {
	flex: 1;
	display: flex;
    margin-bottom: 20px;
	flex-direction: column;
	gap: 4px;
}
.wishlist-title {
	font-size: 1.45rem;
	font-weight: 700;
	color: var(--primary-dark);
}
.wishlist-desc {
	font-size: 1.08rem;
	color: var(--text);
	opacity: 0.85;
}
.wishlist-actions {
	display: flex;
	flex-direction: column;
	align-items: flex-end;
	gap: 12px;
}
.wishlist-price-row {
	display: flex;
	align-items: center;
	gap: 8px;
}
.wishlist-price {
	font-size: 1.25rem;
	font-weight: 700;
	color: var(--text);
}
.wishlist-cart-btn {
	font-size: 1.08rem;
	font-weight: 600;
	background: var(--accent);
	color: var(--primary-dark);
	border: none;
	border-radius: 6px;
	padding: 8px 11px;
	box-shadow: var(--shadow);
	transition: background 0.18s;
}
.wishlist-cart-btn:hover {
	background: var(--accent-dark);
	color: var(--white);
}
.wishlist-remove-btn {
	font-size: 1.08rem;
	font-weight: 600;
	background: var(--danger);
	color: var(--white);
	border: none;
	border-radius: 6px;
	padding: 8px 32px;
	margin-top: 4px;
	box-shadow: var(--shadow);
	transition: background 0.18s;
}
.wishlist-remove-btn:hover {
	background: #b71c1c;
}
hr {
	border: none;
	border-top: 2px solid var(--border);
	margin: 0 0 0 0;
}

.add-to-cart-modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 9999;
    display: flex;
    justify-content: center;
    pointer-events: none;
    transition: transform 0.4s cubic-bezier(.4,0,.2,1), opacity 0.3s;
    transform: translateY(-100%);
    opacity: 0;
}
.add-to-cart-modal.show {
    transform: translateY(0);
    opacity: 1;
    pointer-events: auto;
}
.add-to-cart-modal-content {
    display: flex;
    align-items: center;
    background: var(--white);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 10px 32px 10px 10px;
    margin-top: 16px;
    min-width: 420px;
    max-width: 98vw;
}
.add-to-cart-modal-img {
    width: 65px;
    height: 65px;
    border-radius: 10px;
    background: #ddd;
    margin-right: 18px;
    object-fit: cover;
    border: 2px solid var(--border);
}
.add-to-cart-modal-text {
    font-size: 1.18rem;
    color: var(--text);
    font-weight: 500;
    line-height: 1.3;
}
.add-to-cart-modal-title {
    font-weight: 700;
    color: var(--primary-dark);
}
    </style>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="nav">
        <!-- Add to Cart Notification Modal -->
        <div id="addToCartModal" class="add-to-cart-modal">
            <div class="add-to-cart-modal-content">
                <img src="../img/product-placeholder.png" alt="Product" class="add-to-cart-modal-img">
                <span class="add-to-cart-modal-text"><span class="add-to-cart-modal-title">Product Name</span> has been successfully added to the cart.</span>
            </div>
        </div>
        <img src="../timplatoLogo/Timplato-White2.png" alt="Timplato Logo" class="logo">
        <ul>
            <li class="search-nav-item" style="position:relative;">
                    <a href="#" id="searchToggle">
                        <div class="icon-container">
                            <span class="icon-search"></span>
                        </div>
                    </a>
                <input type="text" id="navbarSearchBar" class="navbar-search-bar" placeholder="Search..." />
            </li>
            <li>
                <a href="../HTML/landingPage.html">
                    <div class="icon-container">
                        <span class="icon-house"></span>
                    </div>
                </a>
            </li>
            <li><a href="../HTML/cart.html">
                <div class="icon-container">
                    <span class="icon-cart"></span>
                </div>
                </a>
            </li>
            <li class="dropdown-user" style="position:relative;">
                <a href="#" id="userDropdownToggle">
                    <div class="icon-container">
                        <span class="icon-user"></span>
                    </div>
                </a>
                <ul id="userDropdownMenu">
                    <li><a href="loginPage.html">Login</a></li>
                    <li><a href="signupPage.html">Sign Up</a></li>
                </ul>
            </li>
        </ul>
    </div>

    <div class="wishlist-container">
        <div class="wishlist-search-row">
            <input type="text" class="wishlist-search" placeholder="Search the Product Name">
            <span class="wishlist-search-icon"></span>
        </div>
        <div class="wishlist-list">
            <!-- Product Card 1 -->
            <div class="wishlist-item">
                <img src="../img/product-placeholder.png" alt="Product" class="wishlist-img">
                <div class="wishlist-info">
                    <div class="wishlist-title">Product Name</div>
                    <div class="wishlist-desc">Set of Product Name</div>
                    <span class="wishlist-price">₱950.00</span>
                </div>
                <div class="wishlist-actions">
                    <button class="wishlist-cart-btn" onclick="showAddToCartModal(this)">ADD TO CART</button>
                    <button class="wishlist-remove-btn">REMOVE</button>
                </div>
            </div>
            <hr>
            <!-- Product Card 2 -->
            <div class="wishlist-item">
                <img src="../img/product-placeholder.png" alt="Product" class="wishlist-img">
                <div class="wishlist-info">
                    <div class="wishlist-title">Product Name</div>
                    <div class="wishlist-desc">Set of Product Name</div>
                    <span class="wishlist-price">₱950.00</span>
                </div>
                <div class="wishlist-actions">
                    <button class="wishlist-cart-btn" onclick="showAddToCartModal(this)">ADD TO CART</button>
                    <button class="wishlist-remove-btn">REMOVE</button>
                </div>
            </div>
        </div>
    </div>
    
<script>
// Show the add to cart modal, update product info
function showAddToCartModal(btn) {
    const modal = document.getElementById('addToCartModal');
    // Find product info
    const item = btn.closest('.wishlist-item');
    const img = item.querySelector('.wishlist-img').src;
    const name = item.querySelector('.wishlist-title').textContent;
    // Update modal content
    modal.querySelector('.add-to-cart-modal-img').src = img;
    modal.querySelector('.add-to-cart-modal-title').textContent = name;
    // Show modal
    modal.classList.add('show');
    // Hide after 2.5s
    setTimeout(() => {
        modal.classList.remove('show');
    }, 2500);
}
</script>
</body>
</html>
