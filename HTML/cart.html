<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart</title>
    <link rel="icon" type="image/x-icon" href="../timplatoLogo/Timplato-Blue-LOGO.png">
    <link rel="stylesheet" href="../CSS/navbar.css">
    <link rel="stylesheet" href="../CSS/cart.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="nav">
        <img src="../timplatoLogo/Timplato-White2.png" alt="Timplato Logo" class="logo">
        <ul>
            <li class="search-nav-item" style="position:relative;">
                <a href="#" id="searchToggle">
                    <div class="icon-container">
                        <span class="icon-search"></span>
                    </div>
                </a>
                <input type="text" id="navbarSearchBar" class="navbar-search-bar" placeholder="Search..." />
            </li>
            <li>
                <a href="../HTML/landingPage.html">
                    <div class="icon-container">
                        <span class="icon-house"></span>
                    </div>
                </a>
            </li>
            <li><a href="../HTML/cart.html">
                <div class="icon-container">
                    <span class="icon-cart"></span>
                </div>
                </a>
            </li>
            <li class="dropdown-user" style="position:relative;">
                <a href="#" id="userDropdownToggle">
                    <div class="icon-container">
                        <span class="icon-user"></span>
                    </div>
                </a>
                <ul id="userDropdownMenu">
                    <li><a href="loginPage.html">Login</a></li>
                    <li><a href="signupPage.html">Sign Up</a></li>
                </ul>
            </li>
        </ul>
    </div>

    <div class="cart-main-container">
        <div class="cart-products-section" id="cartProducts">
            <!-- Product cards will be dynamically inserted here -->
        </div>
        <div class="cart-summary-section">
            <div class="cart-summary-title">Cart Totals:</div>
            <div class="cart-summary-row">Subtotal: <span class="cart-summary-value" id="cartSubtotal">₱0.00</span></div>
            <div class="cart-summary-row">Delivery: <span class="cart-summary-value">FREE</span></div>
            <hr>
            <div class="cart-summary-row">
                <input type="text" class="cart-coupon-input" placeholder="Coupon/Voucher">
                <button class="cart-coupon-btn">Add</button>
            </div>
            <div class="cart-summary-row">Discount: <span class="cart-summary-value" id="cartDiscount">-₱0.00</span></div>
            <div class="cart-summary-row cart-summary-total">Order Total: <span class="cart-summary-value" id="cartTotal">₱0.00</span></div>
            <button class="cart-checkout-btn">CHECKOUT</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script>
    // Utility to format PHP
    function formatPHP(val) {
        return '₱' + Number(val).toFixed(2);
    }

    // Add product card to cart
    function addProductToCart({id, name, subtitle, price, qty=1, img=null}) {
        const cartProducts = document.getElementById('cartProducts');
        // Create card
        const card = document.createElement('div');
        card.className = 'cart-product-card';
        card.setAttribute('data-id', id);
        card.innerHTML = `
            <div class="cart-product-img">${img ? `<img src="${img}" alt="${name}" style="width:100%;height:100%;object-fit:cover;border-radius:8px;">` : ''}</div>
            <div class="cart-product-details">
                <div class="cart-product-title">${name}</div>
                <div class="cart-product-subtitle">${subtitle}</div>
                <div class="cart-product-price">${formatPHP(price)}</div>
                <div class="cart-qty-row">
                    <button class="cart-qty-btn cart-qty-minus">-</button>
                    <span class="cart-qty-value">${qty}</span>
                    <button class="cart-qty-btn cart-qty-plus">+</button>
                    <span class="cart-qty-total">${formatPHP(price * qty)}</span>
                    <button class="cart-remove-btn" title="Remove"><span class="icon-trash"></span></button>
                </div>
                <div class="cart-actions-row">
                    <span class="cart-remove-link"><span class="icon-trash"></span> Remove</span>
                    <span class="cart-save-link"><span class="icon-heart"></span> Save for later</span>
                </div>
            </div>
        `;
        cartProducts.appendChild(card);
        // Add event listeners for qty and remove
        const minus = card.querySelector('.cart-qty-minus');
        const plus = card.querySelector('.cart-qty-plus');
        const value = card.querySelector('.cart-qty-value');
        const total = card.querySelector('.cart-qty-total');
        const removeBtn = card.querySelector('.cart-remove-btn');
        let currentQty = qty;
        minus.addEventListener('click', function() {
            currentQty = Math.max(1, currentQty-1);
            value.textContent = currentQty;
            total.textContent = formatPHP(price * currentQty);
            updateCartTotals();
        });
        plus.addEventListener('click', function() {
            currentQty++;
            value.textContent = currentQty;
            total.textContent = formatPHP(price * currentQty);
            updateCartTotals();
        });
        removeBtn.addEventListener('click', function() {
            card.remove();
            updateCartTotals();
        });
        updateCartTotals();
    }

    // Update cart totals
    function updateCartTotals() {
        const cards = document.querySelectorAll('.cart-product-card');
        let subtotal = 0;
        cards.forEach(card => {
            const qty = parseInt(card.querySelector('.cart-qty-value').textContent);
            const price = Number(card.querySelector('.cart-product-price').textContent.replace('₱',''));
            subtotal += qty * price;
        });
        document.getElementById('cartSubtotal').textContent = formatPHP(subtotal);
        // For now, discount is static
        let discount = subtotal >= 1900 ? 380 : 0;
        document.getElementById('cartDiscount').textContent = '-' + formatPHP(discount);
        document.getElementById('cartTotal').textContent = formatPHP(subtotal - discount);
    }

    // Example usage (remove after API integration)
    addProductToCart({id: 1, name: 'Product Name', subtitle: 'Set of Product Name', price: 950, qty: 1});
    addProductToCart({id: 2, name: 'Product Name', subtitle: 'Set of Product Name', price: 950, qty: 1});
    </script>
    <script src="../JS/navbar.js"></script>
</body>
</html>
